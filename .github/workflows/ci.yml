name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, build and test
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs, not floating tags. A tag is mutable:
      # whoever controls the action repository can repoint v4 at new code, which
      # would then run with this workflow's token. Dependabot proposes SHA bumps
      # as pull requests, so upgrades stay deliberate and CI-verified.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # The floor declared in package.json engines, so CI tests the oldest
          # Node the project claims to support rather than the newest available.
          node-version: '22.13'
          cache: npm

      - run: npm ci

      # Meaningful because the extension ships zero runtime dependencies: this
      # is zero today and would only ever fail if a real dependency appeared.
      # A full `npm audit` is deliberately not gated — see the release commit.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=low

      - name: Lint
        run: npm run lint

      - name: Check icons are current
        run: npm run icons:check

      - name: Build
        run: npm run build

      # Coverage thresholds live in vitest.config.ts and fail the run on their
      # own, so coverage cannot silently regress.
      - name: Test with coverage
        run: npm run test:coverage

      # Uses the project's own packaging script rather than the `zip` binary:
      # same artefact the release workflow attaches, reproducible, and it fails
      # loudly if dist/ is missing a manifest-referenced file.
      - name: Package the unpacked extension
        run: npm run package

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sf-releaselens-unpacked
          path: sf-releaselens.zip
          retention-days: 14

  # Separate job, not another step: this launches a real Chromium and takes
  # minutes rather than seconds. Keeping it apart means a lint or type error
  # still fails in under a minute, and a browser failure is legible as one.
  e2e:
    name: browser end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.13'
          cache: npm

      - run: npm ci

      # The suite drives dist/, not src/. Building here rather than downloading
      # the other job's artefact keeps the two jobs independent.
      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end
        run: npm run test:e2e

      # Traces are only written for failures, so this uploads nothing on a
      # green run and everything needed to debug a red one.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: e2e-failure-artifacts
          path: e2e-results/
          retention-days: 7
